name: Deploy Hexo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install hexo-cli -g
          npm install
          
      - name: Install theme
        run: |
          git clone https://github.com/jerryc127/hexo-theme-butterfly.git themes/Butterfly

      - name: Copy theme config
        run: |
          if [ -f "_config.butterfly.yml" ]; then
            echo "Found _config.butterfly.yml, copying to theme directory..."
            cp _config.butterfly.yml themes/Butterfly/_config.yml
          else
            echo "Warning: _config.butterfly.yml not found in root directory!"
            exit 1
          fi

      - name: Clean and generate
        run: |
          hexo clean
          hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
